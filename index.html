<style>
/* ===== DESIGN TOKENS — derived from cover.jpeg (cream sky, charcoal jacket, river steel-blue, taupe, denim) ===== */
:root{--bg:#f4f2e6;--bg2:#ebe8d9;--surface:#fbfaf4;--text:#131316;--muted:#514d4c;--border:#d8d4c3;--accent:#8c1d2f;--accent-2:#9c9189;--steel:#c5c9ce;--on-accent:#f4f2e6;--shadow:rgba(19,19,22,.22);--foot:#131316;--foot-text:#f4f2e6}

*{box-sizing:border-box;margin:0}html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:70px}
/* animations always on: the OS 'reduce motion' setting is intentionally ignored */
body{font-family:"Inter Tight",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
section{position:relative;padding:110px 6vw}.wrap{max-width:1180px;margin:auto}
h2{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.03em;line-height:1.05;margin-bottom:12px}h2 span{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid var(--text);transition:transform .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-2px)}.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}.btn.ghost:hover{border-color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px;transition:transform .3s,box-shadow .3s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px var(--shadow)}
.chip{display:inline-block;padding:5px 12px;border-radius:99px;border:1px solid var(--border);font-size:.8rem;color:var(--muted);margin:4px 6px 0 0}
.ph{border:1px dashed var(--accent-2);border-radius:8px;padding:2px 8px;color:var(--muted)}
.rv{opacity:0;filter:blur(12px);transform:translateY(22px);transition:opacity .8s ease,filter .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}.rv.in{opacity:1;filter:none;transform:none}
/* nav */
nav{position:fixed;top:14px;left:50%;translate:-50% 0;z-index:50;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 18px;border-radius:99px;direction:ltr;background:color-mix(in srgb,var(--surface) 46%,transparent);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.38);box-shadow:0 10px 30px -14px var(--shadow),inset 0 1px 0 rgba(255,255,255,.45);max-width:96vw}

nav .logo{font-weight:700;margin-right:8px;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:9px}nav .logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}#lang{font-weight:700;font-size:.9rem}nav ul{overflow-x:auto;scrollbar-width:none}nav ul{display:flex;list-style:none;padding:0;gap:2px}
nav ul a{display:block;white-space:nowrap;padding:7px 11px;border-radius:99px;text-decoration:none;font-size:.86rem;color:var(--muted);transition:.2s}nav ul a:hover,nav ul a.on{background:var(--bg2);color:var(--text)}

/* portrait (single shared element) */
#portrait{position:fixed;left:0;top:0;z-index:5;will-change:transform,width,height;touch-action:pan-y}
#portrait.settling{transition:transform 1.4s cubic-bezier(.77,0,.18,1),width 1.4s cubic-bezier(.77,0,.18,1),height 1.4s cubic-bezier(.77,0,.18,1),border-radius 1.4s}
.tilt{width:100%;height:100%;border-radius:inherit;overflow:hidden;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;box-shadow:0 30px 60px -25px var(--shadow),0 8px 18px -8px var(--shadow);background:#f4f2e6}

.hero-text{position:relative}#name{font-size:clamp(2.1rem,6vw,5.4rem);letter-spacing:-.045em;line-height:.95;font-weight:600;transition:transform 1.4s cubic-bezier(.77,0,.18,1),color 1.4s;transform-origin:left top;width:fit-content;max-width:100%}

/* education / exp / services / etc */

.card.edu{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:clamp(18px,3vw,32px);row-gap:0;align-items:start;padding:clamp(22px,3.4vw,36px);border-radius:28px;
 background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gb);
 -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1px 0 var(--gh),0 28px 60px -36px var(--shadow)}

@keyframes eduPulse{0%{box-shadow:0 14px 34px -14px var(--shadow),0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%,100%{box-shadow:0 14px 34px -14px var(--shadow),0 0 0 18px color-mix(in srgb,var(--accent) 0%,transparent)}}
a.edu-logo{animation:eduPulse 1.9s cubic-bezier(.2,.6,.3,1) infinite;cursor:pointer}a.edu-logo:hover,a.edu-logo:focus-visible{animation:none}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:34px}
.tl{margin-top:30px;display:grid;gap:16px}.tl .card{display:grid;grid-template-columns:200px 1fr;gap:20px}@media(max-width:700px){.tl .card{grid-template-columns:1fr}}
.card h3{font-size:1.2rem;margin-bottom:6px;letter-spacing:-.01em}.card p{color:var(--muted);line-height:1.55}

.stack{height:175vh;padding:0}.pin{position:sticky;top:0;height:100svh;padding:84px 5vw 24px;display:flex;flex-direction:column;overflow:hidden}
.pin header{max-width:1180px;width:100%;margin:0 auto 10px}.pin h2{margin:0;font-size:clamp(1.8rem,4.4vw,3.2rem)}
.sgrid{flex:1;min-height:0;width:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;grid-auto-rows:1fr;perspective:1400px}
.sc{cursor:pointer;position:relative;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:0 22px 44px -26px var(--shadow);will-change:transform;min-height:0}

/* footer / contact */
#contact{background:var(--foot);color:var(--foot-text);border-radius:36px 36px 0 0;margin-top:-30px;overflow:hidden;padding-bottom:0;z-index:7}

.mask{display:block;overflow:hidden;padding-bottom:.08em}.mask>*{display:block;transform:translateY(105%);transition:transform 1s cubic-bezier(.2,.7,.2,1)}.in .mask>*{transform:none}

form{display:grid;gap:10px;max-width:560px}input,textarea{font:inherit;padding:14px;border-radius:14px;border:1px solid #34343a;background:#1c1c20;color:#f4f2e6}

.npill{display:inline-flex;align-items:center;gap:12px;vertical-align:middle;margin-inline-start:14px;padding:7px 22px 7px 7px;border-radius:999px;font-family:"Inter Tight",system-ui,sans-serif;font-size:1rem;font-weight:700;letter-spacing:-.01em;color:#f4f2e6;text-decoration:none;white-space:nowrap;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 26px -14px #000;position:relative;top:-.05em}
.npill img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block;background:#2a2a2f}
[dir=rtl] .npill{padding:7px 7px 7px 22px}
.finfo{display:none}
.finfo small,.fnav small{display:block;color:#8a8a90;font-weight:600;font-size:.9rem;margin-bottom:12px}
.fbig{color:#f4f2e6;text-decoration:none;font-size:1.25rem;font-weight:600;letter-spacing:-.02em;word-break:break-all}
.fbig:hover{text-decoration:underline;text-underline-offset:5px}
.finfo .soc-row{gap:10px}
#contact .soc-i{width:44px;height:44px;border:0;background:#f4f2e6;color:#131316}
#contact .soc-i svg{width:20px;height:20px}
#contact .soc-i:hover{background:#2c2c32;color:#f4f2e6}
#cform{grid-template-columns:1fr 1fr;max-width:none;margin-top:56px;padding-top:40px;border-top:1px solid #2a2a2f}
#cform textarea,#cform .btn,#fmsg{grid-column:1/-1}
#cform .btn{justify-self:start;min-width:0;width:auto;margin-top:4px}
.fnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 40px;margin-top:46px;padding-top:34px;border-top:1px solid #2a2a2f}
.flinks{display:grid;grid-template-columns:repeat(2,max-content);gap:12px 36px;justify-content:start}
.flinks.one{grid-template-columns:max-content}
.flinks a{color:#f4f2e6;text-decoration:none;font-weight:600;font-size:.98rem}
.flinks a:hover{text-decoration:underline;text-underline-offset:5px}
.fcopy{display:flex;flex-direction:column;gap:12px;color:#8a8a90;font-size:.95rem;font-weight:600}
.fcopy a{color:#f4f2e6;text-decoration:none;width:fit-content}.fcopy a:hover{text-decoration:underline}
.giant{font-size:min(12vw,160px);letter-spacing:-.07em;line-height:.8;height:.45em;margin-top:56px;overflow:hidden;color:#f4f2e6;-webkit-mask-image:linear-gradient(#000 35%,transparent 97%);mask-image:linear-gradient(#000 35%,transparent 97%)}
@media(max-width:820px){.finfo,.fnav{grid-template-columns:1fr}.finfo{margin-top:40px}#cform{grid-template-columns:1fr}.npill{margin-top:8px;margin-inline-start:0}}
/* hover feel on every icon button */
#cpill a,.mi a,.cm-x{transition:rotate .5s cubic-bezier(.2,.9,.3,1.3),scale .5s cubic-bezier(.2,.9,.3,1.3),translate .5s cubic-bezier(.2,.9,.3,1.3),background .3s,color .3s}
.soc-i:hover,.ab-i:hover,#cpill a:hover,.ibtn:hover,.mi a:hover{transform:none!important}
@media(hover:hover){#cpill a:hover,.mi a:hover,.cm-x:hover,.npill:hover{rotate:-3deg;scale:1.08;translate:0 -2px}}
.npill{transition:rotate .5s cubic-bezier(.2,.9,.3,1.3),scale .5s cubic-bezier(.2,.9,.3,1.3),translate .5s cubic-bezier(.2,.9,.3,1.3),background .3s}

/* blur-in replay when the language changes */
@keyframes blurIn{from{opacity:0;filter:blur(12px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:none}}
.swap{animation:blurIn .9s cubic-bezier(.2,.7,.2,1) both}
.bw{display:inline-block;animation:blurIn .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.022s)}
/* same hover feel on project/certificate cards and the hero portrait */
.pc{transition:rotate .5s cubic-bezier(.2,.9,.3,1.25),scale .5s cubic-bezier(.2,.9,.3,1.25),translate .5s cubic-bezier(.2,.9,.3,1.25),box-shadow .4s}
.pc::after,.tilt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);background-size:250% 100%;background-position:160% 0}
.tilt::before{z-index:2}
#portrait{transition:rotate .5s cubic-bezier(.2,.9,.3,1.25),scale .5s cubic-bezier(.2,.9,.3,1.25),translate .5s cubic-bezier(.2,.9,.3,1.25)}
#portrait.settling{transition:transform 1.4s cubic-bezier(.77,0,.18,1),width 1.4s cubic-bezier(.77,0,.18,1),height 1.4s cubic-bezier(.77,0,.18,1),border-radius 1.4s}
body:not(.intro) #portrait:not(.settling) .tilt img{transition:transform .45s cubic-bezier(.2,.7,.2,1),transform-origin .22s ease-out,object-position 1.4s,filter 1.8s ease;will-change:transform}
@media(hover:hover){
 .pc:hover{rotate:-2deg;scale:1.04;translate:0 -4px}
 .pc:hover::after{opacity:1;animation:shine .9s ease-out .05s both}
 body:not(.intro) #portrait:not(.settling).hov .tilt img{transform:scale(1.75);transform-origin:var(--zx,50%) var(--zy,50%)}
}

/* logo inside the floating contact pill */
#cpill{padding-inline-start:8px;cursor:pointer}#cpill *{cursor:pointer}#cpill .lg{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--border);box-shadow:0 6px 16px -6px var(--shadow)}

/* contact pill: logo + text + animated dots; the 3 icons only appear on hover */
#cpill .act{position:relative;width:46px;height:46px;flex:none;transition:width .5s cubic-bezier(.2,.8,.2,1)}
#cpill .dots{position:absolute;inset:0;border-radius:50%;background:var(--surface);box-shadow:0 6px 16px -6px var(--shadow);display:flex;align-items:center;justify-content:center;gap:5px;transition:opacity .25s}
#cpill .dots i{width:6px;height:6px;border-radius:50%;background:var(--text);animation:dotw 1.1s ease-in-out infinite}
#cpill .dots i:nth-child(2){animation-delay:.15s}#cpill .dots i:nth-child(3){animation-delay:.3s}
@keyframes dotw{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}
#cpill .ic{position:absolute;top:0;bottom:0;inset-inline-start:0;opacity:0;pointer-events:none;transition:opacity .25s}
@media(hover:hover) and (pointer:fine){#cpill:hover .act,#cpill:focus-within .act{width:154px}#cpill:hover .dots,#cpill:focus-within .dots{opacity:0}#cpill:hover .ic,#cpill:focus-within .ic{opacity:1;pointer-events:auto;transition-delay:.12s}}
@media(hover:none),(pointer:coarse){#cpill .act{width:154px}#cpill .dots{display:none}#cpill .ic{opacity:1;pointer-events:auto}}

/* ===== Skills: filter tabs on top + glass cards (same glass recipe as Services / Achievements) ===== */
#skills{isolation:isolate}
#skills::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(44% 40% at 16% 64%,var(--gl1),transparent 72%),radial-gradient(40% 36% at 86% 72%,var(--gl2),transparent 72%)}
.sk-tabs{position:relative;display:flex;gap:4px;width:fit-content;max-width:100%;margin-top:34px;padding:6px;border-radius:99px;overflow-x:auto;scrollbar-width:none;direction:ltr;background:color-mix(in srgb,var(--surface) 46%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--gh),0 14px 30px -22px var(--shadow)}
.sk-tabs::-webkit-scrollbar{display:none}
.sk-ind{position:absolute;top:6px;bottom:6px;left:0;width:var(--iw,0px);transform:translateX(var(--ix,0px));border-radius:99px;background:var(--text);box-shadow:0 10px 22px -10px var(--shadow);transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sk-tab{position:relative;z-index:1;flex:none;appearance:none;border:0;background:none;font:inherit;font-weight:600;font-size:.92rem;letter-spacing:.01em;padding:11px 22px;border-radius:99px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .3s}
.sk-tab:hover{color:var(--text)}.sk-tab[aria-selected=true],.sk-tab[aria-selected=true]:hover{color:var(--bg)}
[dir=rtl] .sk-tab,[dir=rtl] .skc,[dir=rtl] .sk-head{font-family:Cairo,"Inter Tight",system-ui,sans-serif}
.sk-panel{margin-top:22px;padding:30px;border-radius:30px;background:color-mix(in srgb,var(--surface) 40%,transparent);border:1px solid var(--border)}
.sk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--border);animation:skIn .5s cubic-bezier(.2,.8,.2,1) both}
.sk-head i{width:11px;height:11px;border-radius:50%;flex:none;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.sk-head h3{font-size:1.35rem;letter-spacing:-.02em}
.sk-head span{margin-inline-start:auto;color:var(--muted);font-size:.9rem;font-weight:500}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.skc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;min-height:150px;padding:24px 12px 20px;text-align:center;border-radius:22px;overflow:hidden;cursor:default;
 background:radial-gradient(130% 90% at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%),linear-gradient(150deg,var(--g1),var(--g2));
 border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
 box-shadow:inset 0 1px 0 var(--gh),0 24px 50px -30px var(--shadow);
 animation:skIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms);
 transition:scale .45s cubic-bezier(.2,.9,.3,1.25),translate .45s cubic-bezier(.2,.9,.3,1.25),box-shadow .4s}
.sk-panel:not(.in) :is(.skc,.sk-head){animation-play-state:paused}
@keyframes skIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
.skc .ico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);transition:background .35s}
.skc .ico svg{width:28px;height:28px}
.skc b{font-size:1rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.skc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);background-size:250% 100%;background-position:160% 0}
@media(hover:hover){.skc:hover{scale:1.08;translate:0 -5px;z-index:2;box-shadow:inset 0 1px 0 var(--gh),0 34px 60px -26px var(--shadow)}.skc:hover .ico{background:color-mix(in srgb,var(--accent) 28%,transparent)}.skc:hover::after{opacity:1;animation:shine .9s ease-out .05s both}}
@media(max-width:560px){.sk-panel{padding:20px 14px;border-radius:24px}.sk-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.skc{min-height:132px}.sk-tab{padding:10px 16px;font-size:.86rem}.sk-head h3{font-size:1.15rem}}

/* ===== footer / contact in LIGHT theme: warm beige text instead of gray (form included) ===== */
:root:not([data-theme=dark]) #cNote,:root:not([data-theme=dark]) #fmsg{color:#e2dcc4!important}
:root:not([data-theme=dark]) .finfo small,:root:not([data-theme=dark]) .fnav small,:root:not([data-theme=dark]) .fcopy{color:#cfc8ab}
:root:not([data-theme=dark]) #cform input,:root:not([data-theme=dark]) #cform textarea{color:#f4f2e6;caret-color:#f4f2e6}
:root:not([data-theme=dark]) #cform input::placeholder,:root:not([data-theme=dark]) #cform textarea::placeholder{color:#cfc8ab;opacity:1}
/* headline: "Let's … [name] incredible work together" all beige — only the rotating word keeps its blue */
:root:not([data-theme=dark]) #contact h2 span,:root:not([data-theme=dark]) #contact h2>.mask+.mask{color:#f4f2e6!important}

/* ===== Services + Achievements: glass cards (no images) — same pile / deal-out animation as Projects ===== */
:root{--g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.26);--gb:rgba(255,255,255,.85);--gh:rgba(255,255,255,.95);--gl1:rgba(140,29,47,.28);--gl2:rgba(192,138,95,.24)}
:root[data-theme=dark]{--g1:rgba(255,255,255,.12);--g2:rgba(255,255,255,.035);--gb:rgba(255,255,255,.16);--gh:rgba(255,255,255,.24);--gl1:rgba(224,138,151,.22);--gl2:rgba(192,138,95,.17)}
/* soft colour glows behind the cards so the glass has something to blur */
#services,#achievements,#testimonials{isolation:isolate}
#services::before,#achievements::before,#testimonials::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(44% 40% at 16% 64%,var(--gl1),transparent 72%),radial-gradient(40% 36% at 86% 72%,var(--gl2),transparent 72%)}
.agrid{grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:18px}
.pc.glass{aspect-ratio:auto;cursor:default;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:26px;border-radius:22px;
 background:radial-gradient(130% 90% at 0% 0%,color-mix(in srgb,var(--c1) 26%,transparent),transparent 62%),linear-gradient(150deg,var(--g1),var(--g2));
 border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
 box-shadow:inset 0 1px 0 var(--gh),0 24px 50px -30px var(--shadow)}
.pc.glass:hover{box-shadow:inset 0 1px 0 var(--gh),0 34px 60px -28px var(--shadow)}
[dir=rtl] .pc.glass{font-family:Cairo,"Inter Tight",system-ui,sans-serif}
.pc.glass .sico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.pc.glass .sico svg{width:27px;height:27px}
/* services */
.pc.svc{min-height:270px}
.pc.svc h3{margin:6px 0 0;font-size:1.22rem;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--text)}
.pc.svc p{margin:0;font-size:1rem;line-height:1.65;color:color-mix(in srgb,var(--text) 84%,transparent)}
/* achievements */
.pc.stat{min-height:250px}
.pc.stat .num{margin-top:auto;font-size:clamp(2.4rem,4.4vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--text);direction:ltr;unicode-bidi:isolate}
.pc.stat .slbl{font-size:1rem;font-weight:600;line-height:1.3;color:color-mix(in srgb,var(--text) 84%,transparent)}
@media(max-width:1080px){#svcList.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pc.glass{padding:22px}}
@media(max-width:800px){.agrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#aGrid{margin-top:150px}#svcList.agrid{grid-template-columns:1fr}#svcList{margin-top:150px}
 .pc.svc{min-height:0}.pc.stat{min-height:190px;padding:18px;gap:10px}.pc.stat .sico{width:44px;height:44px;border-radius:13px}.pc.stat .sico svg{width:22px;height:22px}.pc.stat .num{font-size:2.2rem}.pc.stat .slbl{font-size:.88rem}}

/* project page: optional 16:9 media + image block under the text (only used by projects that set wide / gallery) */
.pp-img>div.wide{aspect-ratio:16/9}
.pp-gal{border-radius:30px;padding:10px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--border);box-shadow:0 18px 40px -28px var(--shadow)}.pp-gal img{width:100%;height:auto;display:block;border-radius:21px}

.pc>img{object-position:var(--op,50% 50%)}

/* ===== Footer: row 1 = contact cards, row 2 = freelance logo pills (same hover feel as the project cards) ===== */
.sblock{margin-top:54px}
#contact .sblock small{display:block;color:#c5c9ce;font-weight:600;font-size:.9rem;margin-bottom:14px}
.scards{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:16px}
.sc,.fp{transition:opacity .8s ease,filter .8s ease,transform .8s cubic-bezier(.2,.7,.2,1),rotate .5s cubic-bezier(.2,.9,.3,1.25),scale .5s cubic-bezier(.2,.9,.3,1.25),translate .5s cubic-bezier(.2,.9,.3,1.25),background .3s,border-color .3s,box-shadow .4s;transition-delay:var(--d,0s)}
.sc{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 14px 22px;border-radius:20px;text-decoration:none;color:#f4f2e6;
 background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(244,242,230,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 40px -30px #000}
.sc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.22) 50%,transparent 62%);background-size:250% 100%;background-position:160% 0}
.sci{display:grid;place-items:center;width:34px;height:34px;color:#e08a97;margin-bottom:8px}.sci svg{width:30px;height:30px}.sci b{font-size:1.5rem}
.sct{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.scs{max-width:100%;font-size:.86rem;line-height:1.35;color:#c5c9ce;overflow-wrap:break-word}
.sc[href^=mailto] .scs,.sc[href*=wa\.me] .scs,.sc[href^=tel] .scs,.sc[href*=github] .scs{direction:ltr;unicode-bidi:isolate}
.fblock{margin-top:46px;text-align:center}
.fblock h3{margin:0 0 18px;font-size:1.05rem;font-weight:700;letter-spacing:-.01em;color:#f4f2e6}
.fpills{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.fp{display:inline-flex;align-items:center;gap:10px;padding:9px 20px 9px 10px;border-radius:999px;text-decoration:none;color:#f4f2e6;font-weight:600;font-size:.96rem;background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(244,242,230,.14)}
[dir=rtl] .fp{padding:9px 10px 9px 20px}
.fpl{width:28px;height:28px;border-radius:8px;flex:none;display:block;object-fit:cover}.fpt{display:grid;place-items:center;background:#2c2c32;font-size:.85rem}
[dir=rtl] .sc,[dir=rtl] .fp{font-family:Cairo,"Inter Tight",system-ui,sans-serif}
@media(hover:hover){.sc:hover{rotate:-2deg;scale:1.04;translate:0 -4px;border-color:rgba(244,242,230,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 50px -28px #000}
 .sc:hover::after{opacity:1;animation:shine .9s ease-out .05s both}
 .fp:hover{rotate:-3deg;scale:1.07;translate:0 -2px;border-color:rgba(244,242,230,.3);background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}}
.sc:focus-visible,.fp:focus-visible{outline:2px solid #e08a97;outline-offset:3px}
@media(max-width:1000px){.scards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.sblock{margin-top:40px}.fnav{grid-template-columns:1fr}}
@media(max-width:560px){.scards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sc{padding:20px 10px 18px}}

/* footer menu in one horizontal row, copyright row underneath */
.fnav{display:flex;flex-wrap:wrap;align-items:flex-start;gap:26px 40px}
.fnav>div:first-child{flex:1 1 100%;min-width:0}
.flinks{display:flex;flex-wrap:wrap;gap:12px 30px}
.fcopy{flex:1 1 100%;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px}
.pc.stat .num{font-variant-numeric:tabular-nums}

/* ===== Testimonials: same glass cards + pile animation as Achievements ===== */
.tgrid{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.pc.tcard{min-height:240px}
.pc.tcard .tq.tqs{font-size:1.3rem;line-height:1.5;font-style:normal;font-weight:600;color:var(--text)}
.pc.tcard .tq{margin:2px 0 0;font-size:1.02rem;line-height:1.7;font-style:italic;color:color-mix(in srgb,var(--text) 86%,transparent)}
[dir=rtl] .pc.tcard .tq{font-style:normal}
.pc.tcard .tby{margin-top:auto;width:100%;display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
.tav{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.tav svg{width:24px;height:24px}.tav img{width:100%;height:100%;object-fit:cover}
.tin{min-width:0;display:flex;flex-direction:column;gap:2px}
.tin b{font-size:1rem;font-weight:700;line-height:1.25;color:var(--text)}
.tin span{font-size:.88rem;line-height:1.35;font-weight:600;color:var(--accent)}

@media(max-width:800px){#tGrid.agrid{grid-template-columns:1fr}#tGrid{margin-top:150px}.pc.tcard{min-height:0}}

/* project header: optional GitHub button before the main button */
.pp-head .btn.gh{margin-inline-start:auto}
.pp-head .btn.gh+.btn{margin-inline-start:0}
@media(max-width:560px){.pp-head .btn.gh{display:none}}
